<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Quest</title>
<style>
  :root {
    --bg: #0f1220;
    --bg2: #171a2e;
    --card: #1e2238;
    --card2: #262b45;
    --accent: #6c8cff;
    --accent2: #a855f7;
    --good: #22c55e;
    --bad: #ef4444;
    --text: #e8ebf5;
    --muted: #9aa3c0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 20% 0%, #1b1f3a 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
  }
  .app {
    width: 100%;
    max-width: 640px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 12px;
  }
  h1 {
    font-size: 1.4rem;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .stats {
    display: flex;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .stat {
    background: var(--card);
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid #2a3050;
  }
  .stat b { color: var(--text); }

  .progress-bar {
    height: 6px;
    background: var(--card);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .card-wrap {
    perspective: 1200px;
    margin-bottom: 22px;
  }
  .card {
    position: relative;
    width: 100%;
    min-height: 300px;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 20px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(145deg, var(--card2), var(--card));
    border: 1px solid #2f3556;
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .face.back {
    transform: rotateY(180deg);
    background: linear-gradient(145deg, #2a2f52, #1f2340);
  }
  .label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.7rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  .face.back .label { color: var(--accent2); }
  .content {
    font-size: 1.35rem;
    line-height: 1.5;
    font-weight: 500;
  }
  .face.back .content { font-size: 1.15rem; }
  .hint {
    position: absolute;
    bottom: 14px;
    font-size: 0.7rem;
    color: var(--muted);
    opacity: 0.7;
  }
  .category {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 0.65rem;
    padding: 3px 9px;
    border-radius: 99px;
    background: rgba(108, 140, 255, 0.15);
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  button {
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 14px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s, opacity 0.2s;
    color: #fff;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-wrong { background: linear-gradient(135deg, #ef4444, #b91c1c); }
  .btn-right { background: linear-gradient(135deg, #22c55e, #15803d); }
  .btn-flip {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  .btn-restart {
    background: var(--card2);
    border: 1px solid #2f3556;
  }

  .results {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(145deg, var(--card2), var(--card));
    border-radius: 20px;
    border: 1px solid #2f3556;
  }
  .results h2 {
    font-size: 2rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .results p { color: var(--muted); margin-bottom: 20px; }
  .score-big { font-size: 3rem; font-weight: 700; margin: 10px 0; }
  .hidden { display: none; }

  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotateY(180deg); }
    25% { transform: translateX(-8px) rotateY(180deg); }
    75% { transform: translateX(8px) rotateY(180deg); }
  }
  .pop { animation: pop 0.4s; }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.06); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  @media (max-width: 480px) {
    .content { font-size: 1.1rem; }
    .face { padding: 24px 20px; min-height: 260px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⚡ Flashcard Quest</h1>
    <div class="stats">
      <div class="stat">Card <b id="cardNum">1</b>/<b id="cardTotal">0</b></div>
      <div class="stat">Score <b id="score">0</b></div>
      <div class="stat">🔥 <b id="streak">0</b></div>
    </div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div id="gameArea">
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="face front">
          <span class="label">Question</span>
          <span class="category" id="categoryFront">—</span>
          <div class="content" id="question">Loading…</div>
          <span class="hint">Click card or press Space to flip</span>
        </div>
        <div class="face back">
          <span class="label">Answer</span>
          <div class="content" id="answer">—</div>
          <span class="hint">Did you get it right?</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-flip" id="flipBtn">🔄 Flip Card (Space)</button>
      <button class="btn-wrong" id="wrongBtn" disabled>✗ Missed It (←)</button>
      <button class="btn-right" id="rightBtn" disabled>✓ Got It (→)</button>
    </div>
  </div>

  <div id="resultsArea" class="results hidden">
    <h2 id="resultsTitle">Quiz Complete!</h2>
    <div class="score-big" id="finalScore">0 / 0</div>
    <p id="resultsMsg"></p>
    <button class="btn-flip" id="restartBtn">↻ Play Again</button>
  </div>
</div>

<script>
// ====== EDIT YOUR FLASHCARDS HERE ======
const CARDS = [
  { category: "Biology", question: "What is the powerhouse of the cell?", answer: "The mitochondria — it produces ATP through cellular respiration." },
  { category: "Biology", question: "What process do plants use to convert sunlight into food?", answer: "Photosynthesis: CO₂ + H₂O + light → glucose + O₂." },
  { category: "Math", question: "What is the Pythagorean theorem?", answer: "a² + b² = c², where c is the hypotenuse of a right triangle." },
  { category: "Math", question: "What is the value of π (pi) to two decimal places?", answer: "3.14" },
  { category: "History", question: "In what year did World War II end?", answer: "1945" },
  { category: "History", question: "Who was the first President of the United States?", answer: "George Washington (1789–1797)." },
  { category: "Chemistry", question: "What is the chemical symbol for gold?", answer: "Au (from the Latin 'aurum')." },
  { category: "Chemistry", question: "What is H₂O commonly known as?", answer: "Water." },
  { category: "Geography", question: "What is the longest river in the world?", answer: "The Nile (≈6,650 km) — though some argue the Amazon." },
  { category: "Geography", question: "What is the capital of Japan?", answer: "Tokyo." },
  { category: "Physics", question: "What is Newton's Second Law of Motion?", answer: "F = ma (Force = mass × acceleration)." },
  { category: "English", question: "What is a metaphor?", answer: "A figure of speech comparing two things WITHOUT 'like' or 'as' (e.g., 'time is a thief')." },
];
// =======================================

const state = {
  deck: [],
  index: 0,
  score: 0,
  streak: 0,
  bestStreak: 0,
  flipped: false,
  answered: false,
  missed: []
};

const $ = id => document.getElementById(id);
const card = $('card');

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startGame() {
  state.deck = shuffle(CARDS);
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.bestStreak = 0;
  state.missed = [];
  $('resultsArea').classList.add('hidden');
  $('gameArea').classList.remove('hidden');
  $('cardTotal').textContent = state.deck.length;
  renderCard();
}

function renderCard() {
  const c = state.deck[state.index];
  state.flipped = false;
  state.answered = false;
  card.classList.remove('flipped', 'shake', 'pop');
  $('question').textContent = c.question;
  $('answer').textContent = c.answer;
  $('categoryFront').textContent = c.category || '—';
  $('cardNum').textContent = state.index + 1;
  $('score').textContent = state.score;
  $('streak').textContent = state.streak;
  $('progress').style.width = ((state.index) / state.deck.length) * 100 + '%';

  $('flipBtn').disabled = false;
  $('wrongBtn').disabled = true;
  $('rightBtn').disabled = true;
}

function flip() {
  if (state.answered) return;
  state.flipped = !state.flipped;
  card.classList.toggle('flipped', state.flipped);
  $('flipBtn').disabled = state.flipped;
  $('wrongBtn').disabled = !state.flipped;
  $('rightBtn').disabled = !state.flipped;
}

function answer(correct) {
  if (!state.flipped || state.answered) return;
  state.answered = true;

  if (correct) {
    state.streak++;
    state.bestStreak = Math.max(state.bestStreak, state.streak);
    const bonus = state.streak >= 3 ? 2 : 1;
    state.score += bonus;
    card.classList.add('pop');
  } else {
    state.streak = 0;
    state.missed.push(state.deck[state.index]);
    card.classList.add('shake');
  }
  $('score').textContent = state.score;
  $('streak').textContent = state.streak;

  $('flipBtn').disabled = true;
  $('wrongBtn').disabled = true;
  $('rightBtn').disabled = true;

  setTimeout(() => {
    state.index++;
    if (state.index >= state.deck.length) {
      showResults();
    } else {
      renderCard();
    }
  }, 650);
}

function showResults() {
  $('gameArea').classList.add('hidden');
  $('resultsArea').classList.remove('hidden');
  const total = state.deck.length;
  const pct = Math.round((state.score / (total * 1)) * 100);
  $('finalScore').textContent = `${state.score} pts`;
  $('progress').style.width = '100%';

  let msg = '';
  if (state.score >= total * 1.5) msg = "🏆 Outstanding! You're crushing it.";
  else if (state.score >= total) msg = "⭐ Great job! Solid understanding.";
  else if (state.score >= total * 0.6) msg = "👍 Nice work — a little more review and you've got this.";
  else msg = "📚 Keep studying — repetition is the key to mastery!";

  if (state.bestStreak >= 3) msg += ` Best streak: ${state.bestStreak} 🔥`;
  if (state.missed.length) msg += ` You missed ${state.missed.length} card(s).`;

  $('resultsMsg').textContent = msg;
}

// --- Events ---
card.addEventListener('click', flip);
$('flipBtn').addEventListener('click', flip);
$('rightBtn').addEventListener('click', () => answer(true));
$('wrongBtn').addEventListener('click', () => answer(false));
$('restartBtn').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
  if ($('resultsArea').classList.contains('hidden')) {
    if (e.code === 'Space') { e.preventDefault(); flip(); }
    if (e.code === 'ArrowRight' && state.flipped) answer(true);
    if (e.code === 'ArrowLeft' && state.flipped) answer(false);
  } else if (e.code === 'Enter') {
    startGame();
  }
});

startGame();
</script>
</body>
</html>
